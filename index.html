
<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  
  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <div class="card">
    <div class="header-tarjeta">
      <h2>Registro</h2>
      
      <button id="btnModo" class="btn-modo">🌙 Modo oscuro</button>
    </div>

    <form id="formRegistro" novalidate>
      
      <div class="campo-grupo">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" placeholder="Tu nombre completo">
        <span id="errorNombre" class="mensaje-error"></span>
      </div>

     
      <div class="campo-grupo">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="ejemplo@correo.com">
        <span id="errorEmail" class="mensaje-error"></span>
      </div>

      
      <div class="campo-grupo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Mínimo 8 caracteres" maxlength="20">
      
        <div id="contadorPassword" class="contador-caracteres">0 / 20 caracteres</div>
        <span id="errorPassword" class="mensaje-error"></span>
      </div>

      
      <div class="campo-grupo">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input id="confirmPassword" type="password" placeholder="Repite tu contraseña">
        <span id="errorConfirmPassword" class="mensaje-error"></span>
      </div>

      <button type="submit" class="btn-submit">Crear cuenta</button>
    </form>

    <div id="mensajeFinal"></div>
  </div>

  
  <script src="script.js"></script>
  
</body>
</html>
